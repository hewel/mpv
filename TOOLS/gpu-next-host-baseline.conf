# Matched native/embedded Linux SDR comparison. See DOCS/gpu-next-host-baseline.rst.
# Load explicitly with --no-config --include=<absolute path to this file>.
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=vaapi
profile=gpu-hq
target-colorspace-hint=yes
tone-mapping=bt.2446a
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
scale-antiring=0.7
cscale-antiring=0.7
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.3
hdr-compute-peak=auto
dither-depth=auto
dither=fruit
target-trc=auto
target-prim=auto
target-peak=auto
target-contrast=auto
hdr-reference-white=auto
gamut-mapping-mode=auto
video-sync=audio
interpolation=no
wayland-internal-vsync=no
# Remove non-video overlays equally on both comparison paths, not color effects.
load-scripts=no
osc=no
osd-level=0
sid=no
save-position-on-quit=no
